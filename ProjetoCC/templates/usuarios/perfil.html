{% extends 'base.html' %}


{% block title %}
    <title>Perfil | PlanoFit</title>
{% endblock %}


{% block content %}

<div class="container">

    <h1>Meu perfil</h1>

    <p>Atualize suas informações pessoais.</p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Salvar alterações
        </button>

    </form>

</div>

{% endblock %}
