{% extends 'base.html' %}


{% block title %}
    <title>Perfil | PlanoFit</title>
{% endblock %}


{% block nav %}
    <nav>
        <a href="{% url 'monitoramento:dashboard' %}" class="navbar-brand">PlanoFit</a>

        <form method="POST" action="{% url 'logout' %}" class="form-logout">
            {% csrf_token %}
            <button type="submit" class="botao-logout">Sair</button>
        </form>

        <a href="{% url 'monitoramento:dashboard' %}">Dashboard</a>
        <a href="{% url 'treino:criar_perfil' %}">Criar ficha</a>
        <a href="{% url 'treino:biblioteca' %}">Biblioteca</a>
    </nav>
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>Meu perfil</h1>

    <p>Atualize suas informações pessoais.</p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Salvar alterações
        </button>

    </form>

</div>

{% endblock %}
